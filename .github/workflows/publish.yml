name: Release

on:
  push:
    branches:
      - main
  # Manual run: re-sync the Homebrew tap from the formula on main without
  # cutting a release (for example, right after creating the tap repo).
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          release-type: node

      - uses: actions/checkout@v7
        if: ${{ steps.release.outputs.release_created }}

      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
        if: ${{ steps.release.outputs.release_created }}

      - uses: oven-sh/setup-bun@v2
        if: ${{ steps.release.outputs.release_created }}

      - run: bun install --frozen-lockfile
        if: ${{ steps.release.outputs.release_created }}

      - run: bun run build
        if: ${{ steps.release.outputs.release_created }}

      - run: npm publish --access public --provenance
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        if: ${{ steps.release.outputs.release_created }}

  # Bump the formula in the dedicated tap (brew tap ianjwhite99/tap) to the
  # version that was just published. Needs a HOMEBREW_TAP_TOKEN secret: a
  # fine-grained PAT with "Contents: read and write" on
  # ianjwhite99/homebrew-tap. Skips with a warning if unset.
  homebrew-tap:
    needs: release-please
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TAP_REPO: ianjwhite99/homebrew-tap
      HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - name: Update formula in Homebrew tap
        run: |
          if [ -z "$HOMEBREW_TAP_TOKEN" ]; then
            echo "::warning::HOMEBREW_TAP_TOKEN is not set; skipping Homebrew tap update"
            exit 0
          fi
          VERSION="$(node -p "require('./package.json').version")"
          git clone --depth 1 "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/${TAP_REPO}.git" tap
          scripts/update-homebrew-formula.sh tap/Formula/opencode-with-claude.rb "$VERSION"
          cd tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/opencode-with-claude.rb
          if git diff --cached --quiet; then
            echo "Tap already at v$VERSION"
            exit 0
          fi
          git commit -m "opencode-with-claude: update to v$VERSION"
          git push
